<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux & Roblox Plus Store</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <!-- Google Gaming Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between antialiased pb-10">

    <!-- HEADER -->
    <header class="w-full text-center py-8 px-4">
        <div class="inline-block text-4xl md:text-5xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500 uppercase mb-2 neon-glow">
            🎮 ROBUX STORE 🎮
        </div>
        <p class="text-xs md:text-sm text-gray-400 max-w-md mx-auto">Instant Robux & Roblox Plus Deliveries. Safe, reliable, and tailored for all gaming enthusiasts.</p>
    </header>

    <!-- MAIN INTERACTIVE HUB -->
    <main class="w-full max-w-md mx-auto px-4 flex-grow">
        <div class="gaming-card rounded-2xl p-6 mb-6">
            
            <!-- यहाँ अंदर के सारे फोल्डर्स का कोड लोड होगा -->
            <div id="username-component"></div>
            <div id="packages-component" class="hidden"></div>
            <div id="payment-component" class="hidden"></div>

        </div>
    </main>

    <!-- STICKY ACTION LAUNCHER -->
    <div id="sticky-action-bar" class="w-full max-w-md mx-auto px-4">
        <button onclick="focusStore()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-extrabold py-4 px-6 rounded-2xl uppercase tracking-widest shadow-xl text-center text-base transform active:scale-95 transition-transform">
            ⚡ Buy Robux Now ⚡
        </button>
    </div>

    <!-- Main Logic Script Connection -->
    <script src="main.js"></script>
</body>
</html>
